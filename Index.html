DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animal Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: green;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .gallery img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border: 3px solid white;
            border-radius: 10px;
            box-shadow: 0 4px 8px #aaa;
        }
    </style>
</head>

<body>
    <h1>My Animal Gallery</h1>
    <p>Welcome to my collection of 10 animals!</p>

    <div class="gallery">
        <img src="https://loremflickr.com/400/300/lion" alt="Lion">
        <img src="https://loremflickr.com/400/300/elephant" alt="Elephant">
        <img src="https://loremflickr.com/400/300/giraffe" alt="Giraffe">
        <img src="https://loremflickr.com/400/300/zebra" alt="Zebra">
        <img src="https://loremflickr.com/400/300/monkey" alt="Monkey">
        <img src="https://loremflickr.com/400/300/dog" alt="Dog">
        <img src="https://loremflickr.com/400/300/cat" alt="Cat">
        <img src="https://loremflickr.com/400/300/rabbit" alt="Rabbit">
        <img src="https://loremflickr.com/400/300/tiger" alt="Tiger">
        <img src="https://loremflickr.com/400/300/panda" alt="Panda">
    </div>
</body>
</html>
